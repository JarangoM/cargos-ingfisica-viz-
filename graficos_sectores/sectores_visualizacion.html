<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sectores de empleo de egresados — Ing. Física</title>
<style>
  :root {
    color-scheme: light dark;
    --bg: #0f1420;
    --panel: #171d2b;
    --panel-2: #1e2536;
    --texto: #e8ebf3;
    --texto-tenue: #9aa4bd;
    --borde: #2a3348;
    --acento: #4C6EF5;
  }
  @media (prefers-color-scheme: light) {
    :root {
      --bg: #f5f6fa;
      --panel: #ffffff;
      --panel-2: #eef0f6;
      --texto: #1c2130;
      --texto-tenue: #5b6479;
      --borde: #dde1ec;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
    background: var(--bg);
    color: var(--texto);
    padding-bottom: 96px; /* espacio para leyenda fija */
  }
  header {
    padding: 24px 28px 14px;
    border-bottom: 1px solid var(--borde);
  }
  h1 { margin: 0 0 4px; font-size: 1.4rem; }
  .subtitulo { color: var(--texto-tenue); font-size: 0.92rem; }

  .barra-controles {
    margin-top: 16px;
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 14px;
  }

  .tabs {
    display: inline-flex;
    background: var(--panel-2);
    border: 1px solid var(--borde);
    border-radius: 9px;
    padding: 3px;
    gap: 3px;
  }
  .tab-btn {
    border: none;
    background: transparent;
    color: var(--texto-tenue);
    font-size: 0.86rem;
    font-weight: 600;
    padding: 7px 16px;
    border-radius: 6px;
    cursor: pointer;
  }
  .tab-btn.activo {
    background: var(--acento);
    color: #fff;
  }

  .control-filtro {
    display: inline-flex;
    align-items: center;
    gap: 8px;
  }
  .control-filtro label {
    font-size: 0.8rem;
    color: var(--texto-tenue);
  }
  .control-filtro select {
    background: var(--panel-2);
    color: var(--texto);
    border: 1px solid var(--borde);
    border-radius: 8px;
    padding: 7px 10px;
    font-size: 0.85rem;
    font-weight: 600;
    max-width: 320px;
    cursor: pointer;
  }
  .control-filtro select:focus {
    outline: 2px solid var(--acento);
    outline-offset: 1px;
  }
  #btn-limpiar-filtro {
    border: 1px solid var(--borde);
    background: transparent;
    color: var(--texto-tenue);
    font-size: 0.78rem;
    padding: 6px 10px;
    border-radius: 7px;
    cursor: pointer;
    display: none;
  }
  #btn-limpiar-filtro.visible { display: inline-block; }

  .pista-clic {
    font-size: 0.76rem;
    color: var(--texto-tenue);
    display: inline-flex;
    align-items: center;
    gap: 5px;
  }
  .pista-clic::before {
    content: "";
    width: 6px; height: 6px;
    border-radius: 50%;
    background: var(--acento);
    display: inline-block;
    flex-shrink: 0;
  }

  main { padding: 22px 28px 20px; transition: margin-right 0.25s ease; }
  main.con-panel { margin-right: 400px; }
  @media (max-width: 1100px) {
    main.con-panel { margin-right: 0; }
  }

  .grupo-periodo { margin-bottom: 30px; }
  .grupo-periodo h2 {
    font-size: 0.98rem;
    margin: 0 0 12px;
    color: var(--texto);
    border-left: 3px solid var(--acento);
    padding-left: 10px;
  }
  .grupo-periodo .n-periodo {
    color: var(--texto-tenue);
    font-weight: 400;
    font-size: 0.85rem;
  }

  .fila-graficos {
    display: grid;
    grid-template-columns: repeat(5, 1fr);
    gap: 14px;
  }
  @media (max-width: 1200px) {
    .fila-graficos { grid-template-columns: repeat(3, 1fr); }
  }
  @media (max-width: 700px) {
    .fila-graficos { grid-template-columns: repeat(2, 1fr); }
  }
  @media (max-width: 460px) {
    .fila-graficos { grid-template-columns: 1fr; }
  }

  .tarjeta-grafico {
    background: var(--panel);
    border: 1px solid var(--borde);
    border-radius: 10px;
    padding: 14px 14px 10px;
    display: flex;
    flex-direction: column;
    align-items: center;
  }
  .tarjeta-grafico .titulo-grafico {
    font-size: 0.78rem;
    font-weight: 600;
    text-align: center;
    color: var(--texto);
    margin-bottom: 2px;
  }
  .tarjeta-grafico .subtitulo-grafico {
    font-size: 0.72rem;
    color: var(--texto-tenue);
    margin-bottom: 8px;
  }
  .tarjeta-grafico.vacia {
    justify-content: center;
    min-height: 160px;
    color: var(--texto-tenue);
    font-size: 0.8rem;
  }
  .tarjeta-grafico .nota-ausente {
    font-size: 0.68rem;
    color: var(--texto-tenue);
    margin-top: 6px;
    font-style: italic;
  }

  .slice { cursor: pointer; transition: filter 0.1s, opacity 0.15s; transform-origin: center; }
  .slice:hover { filter: brightness(1.12); }
  .slice.resaltado { filter: none; }
  .slice.activo { stroke: var(--acento) !important; stroke-width: 3 !important; }
  .etiqueta-slice {
    font-size: 9.5px;
    font-weight: 700;
    fill: #fff;
    pointer-events: none;
    text-shadow: 0 1px 2px rgba(0,0,0,0.55);
  }
  .etiqueta-slice.resaltada {
    font-size: 10.5px;
    fill: var(--texto);
    text-shadow: none;
  }
  .fondo-etiqueta {
    fill: var(--panel);
    stroke: var(--borde);
    stroke-width: 1;
    pointer-events: none;
  }
  .linea-guia {
    stroke: var(--texto-tenue);
    stroke-width: 1;
    fill: none;
    pointer-events: none;
  }

  #tooltip {
    position: fixed;
    display: none;
    background: var(--panel-2);
    border: 1px solid var(--borde);
    color: var(--texto);
    padding: 8px 12px;
    border-radius: 8px;
    font-size: 0.82rem;
    pointer-events: none;
    max-width: 320px;
    z-index: 60;
    box-shadow: 0 6px 18px rgba(0,0,0,0.25);
  }
  #tooltip .tt-sector { font-weight: 700; }
  #tooltip .tt-cat { color: var(--texto-tenue); font-size: 0.75rem; }
  #tooltip .tt-pista { color: var(--acento); font-size: 0.73rem; margin-top: 3px; }

  #leyenda-fija {
    position: fixed;
    left: 0; right: 0; bottom: 0;
    background: var(--panel);
    border-top: 1px solid var(--borde);
    padding: 10px 20px;
    display: flex;
    flex-wrap: wrap;
    gap: 6px 18px;
    justify-content: center;
    align-items: center;
    z-index: 50;
    box-shadow: 0 -6px 18px rgba(0,0,0,0.18);
  }
  .item-leyenda {
    display: flex;
    align-items: center;
    gap: 6px;
    font-size: 0.78rem;
    color: var(--texto);
    padding: 3px 7px;
    border-radius: 6px;
    transition: opacity 0.15s, background 0.15s;
  }
  .item-leyenda .punto {
    width: 11px; height: 11px;
    border-radius: 3px;
    flex-shrink: 0;
  }
  #leyenda-fija.filtro-activo .item-leyenda {
    opacity: 0.4;
  }
  #leyenda-fija.filtro-activo .item-leyenda.seleccionado {
    opacity: 1;
    background: var(--panel-2);
    font-weight: 700;
  }
  #leyenda-fija.filtro-activo .item-leyenda.seleccionado .punto {
    box-shadow: 0 0 0 2px var(--acento);
  }
  .leyenda-etiqueta {
    font-size: 0.7rem;
    color: var(--texto-tenue);
    text-transform: uppercase;
    letter-spacing: 0.04em;
    margin-right: 4px;
  }

  /* ── Panel lateral de empleadores ─────────────────────────────────────── */
  #panel-empleadores {
    position: fixed;
    top: 0; right: -420px;
    width: 400px; height: 100%;
    background: var(--panel);
    border-left: 1px solid var(--borde);
    transition: right 0.25s ease;
    z-index: 70;
    display: flex;
    flex-direction: column;
    box-shadow: -8px 0 24px rgba(0,0,0,0.25);
  }
  #panel-empleadores.abierto { right: 0; }
  @media (max-width: 460px) {
    #panel-empleadores { width: 100%; right: -100%; }
  }
  #panel-empleadores .encabezado-panel {
    padding: 18px 20px 14px;
    border-bottom: 1px solid var(--borde);
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    gap: 10px;
  }
  #panel-empleadores .encabezado-texto { min-width: 0; }
  #panel-titulo-sector {
    font-size: 1.02rem;
    font-weight: 700;
    display: flex;
    align-items: center;
    gap: 8px;
  }
  #panel-titulo-sector .punto-sector {
    width: 11px; height: 11px;
    border-radius: 3px;
    flex-shrink: 0;
  }
  #panel-subtitulo {
    font-size: 0.78rem;
    color: var(--texto-tenue);
    margin-top: 4px;
  }
  #panel-resumen {
    font-size: 0.82rem;
    color: var(--texto-tenue);
    margin-top: 8px;
  }
  #panel-resumen strong { color: var(--texto); }
  #cerrar-panel {
    background: none; border: none; color: var(--texto-tenue);
    font-size: 1.4rem; cursor: pointer; line-height: 1; padding: 2px 4px;
    flex-shrink: 0;
  }
  #cerrar-panel:hover { color: var(--texto); }

  #panel-orden {
    padding: 10px 20px 0;
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 0.76rem;
    color: var(--texto-tenue);
  }
  #panel-orden select {
    background: var(--panel-2);
    color: var(--texto);
    border: 1px solid var(--borde);
    border-radius: 6px;
    padding: 4px 8px;
    font-size: 0.76rem;
    cursor: pointer;
  }

  #panel-cuerpo { overflow-y: auto; padding: 10px 20px 24px; flex: 1; }
  .fila-empleador {
    display: flex; gap: 10px; align-items: center; justify-content: space-between;
    padding: 8px 0; border-bottom: 1px solid var(--borde);
    font-size: 0.87rem;
  }
  .fila-empleador .nombre-empleador {
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  .fila-empleador .conteo-empleador {
    background: var(--panel-2); border-radius: 6px;
    padding: 2px 9px; font-size: 0.78rem; color: var(--texto);
    font-weight: 600;
    min-width: 22px; text-align: center; flex-shrink: 0;
  }
  #panel-vacio {
    padding: 30px 4px; text-align: center; color: var(--texto-tenue); font-size: 0.85rem;
  }

  #fondo-panel {
    position: fixed; inset: 0; background: rgba(0,0,0,0.25);
    z-index: 65; opacity: 0; pointer-events: none; transition: opacity 0.2s ease;
  }
  #fondo-panel.visible { opacity: 1; pointer-events: auto; }
  @media (min-width: 1101px) {
    #fondo-panel { display: none; }
  }
</style>
</head>
<body>

<header>
  <h1>Sectores de empleo de los egresados — Ingeniería Física</h1>
  <div class="subtitulo">Distribución por sector de la empresa/entidad empleadora, para cada uno de los 5 trabajos reportados, por periodo de graduación y ámbito nacional/internacional.</div>
  <div class="barra-controles">
    <div class="tabs">
      <button class="tab-btn" data-ambito="nacional">Nacional</button>
      <button class="tab-btn" data-ambito="internacional">Internacional</button>
    </div>
    <div class="control-filtro">
      <label for="filtro-sector">Centrar en sector:</label>
      <select id="filtro-sector">
        <option value="">Todos los sectores</option>
      </select>
    </div>
    <button id="btn-limpiar-filtro" type="button">Quitar filtro ✕</button>
    <span class="pista-clic">Haz clic en un sector del gráfico para ver sus empleadores</span>
  </div>
</header>

<main id="contenedor-principal"></main>

<div id="tooltip"></div>

<div id="leyenda-fija"></div>

<div id="fondo-panel"></div>

<div id="panel-empleadores" role="dialog" aria-label="Empleadores del sector seleccionado">
  <div class="encabezado-panel">
    <div class="encabezado-texto">
      <div id="panel-titulo-sector"><span class="punto-sector" id="panel-punto"></span><span id="panel-nombre-sector"></span></div>
      <div id="panel-subtitulo"></div>
      <div id="panel-resumen"></div>
    </div>
    <button id="cerrar-panel" aria-label="Cerrar">&times;</button>
  </div>
  <div id="panel-orden">
    <label for="panel-orden-select">Ordenar:</label>
    <select id="panel-orden-select">
      <option value="desc">Mayor a menor</option>
      <option value="asc">Menor a mayor</option>
      <option value="alfa">Alfabético</option>
    </select>
  </div>
  <div id="panel-cuerpo"></div>
</div>

<script src="sectores_datos.js"></script>
<script src="sectores_visualizacion.js"></script>
</body>
</html>
